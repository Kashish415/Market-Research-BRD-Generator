market_research_task:
  description: >
    Conduct market research for the following business idea:

    Business Idea: {business_idea}
    Business Problem: {business_problem}
    Business Objectives: {business_objectives}
    Target Users: {target_users}
    Industry: {industry}
    Industry Details: {industry_details}
    Target Geography: {target_geography}
    Proposed Features: {proposed_features}
    Existing Systems and Constraints: {existing_systems_constraints}

    Analyse the relevant market, including:

    1. Market Size and Growth:
       - TAM, SAM, and SOM where reliable data is available.
       - Market growth and relevant forecasts.
       - Market maturity and major growth drivers.

    2. Industry Trends:
       - Important industry developments.
       - Technology adoption and emerging trends.
       - Relevant opportunities and threats.

    3. Regulatory Landscape:
       - Applicable regulations and compliance considerations.
       - Data privacy and security considerations where relevant.

    4. Market Opportunities:
       - Emerging customer needs.
       - Underserved market segments.
       - Factors affecting market adoption.

    Use credible and recent sources. Include source URLs and
    publication dates wherever available.

    Do not invent market figures or present unsupported estimates
    as facts. Clearly state assumptions and data limitations.

  expected_output: >
    A structured market research report covering market overview,
    available market sizing, growth trends, industry developments,
    applicable regulations, opportunities, risks, and source references.

  async_execution: true
  markdown: true
  agent: market_research_specialist


competitive_intelligence_task:
  description: >
    Conduct competitive intelligence research for the following
    business idea:

    Business Idea: {business_idea}
    Business Problem: {business_problem}
    Business Objectives: {business_objectives}
    Target Users: {target_users}
    Industry: {industry}
    Industry Details: {industry_details}
    Target Geography: {target_geography}
    Proposed Features: {proposed_features}
    Existing Systems and Constraints: {existing_systems_constraints}

    Analyse the competitive landscape, including:

    1. Competitor Identification:
       - Relevant direct competitors.
       - Indirect competitors and alternative solutions.
       - Emerging products where credible information is available.

    2. Competitor Comparison:
       - Company and product overview.
       - Core features and capabilities.
       - Target customers.
       - Publicly available pricing.
       - Product positioning and differentiation.
       - Strengths and limitations.

    3. Competitive Gaps:
       - Features or needs not adequately addressed.
       - Underserved customer segments.
       - Potential areas of differentiation.
       - Competitive threats and barriers to entry.

    Use competitor websites, product documentation, customer
    reviews, and other credible public sources.

    Include source URLs. Do not invent competitor information,
    funding details, customer numbers, or pricing.

  expected_output: >
    A structured competitive intelligence report containing relevant
    competitor profiles, a feature and pricing comparison matrix,
    market positioning, competitive strengths and weaknesses,
    market gaps, and source references.

  async_execution: true
  markdown: true
  agent: competitive_intelligence_analyst


customer_insights_task:
  description: >
    Research potential customers for the following business idea:

    Business Idea: {business_idea}
    Business Problem: {business_problem}
    Business Objectives: {business_objectives}
    Target Users: {target_users}
    Industry: {industry}
    Industry Details: {industry_details}
    Target Geography: {target_geography}
    Proposed Features: {proposed_features}
    Existing Systems and Constraints: {existing_systems_constraints}

    Analyse the following:

    1. Customer Segmentation:
       - Relevant customer segments.
       - Primary and secondary target users.
       - Important characteristics of each segment.

    2. Customer Needs and Pain Points:
       - Problems customers currently face.
       - Existing alternatives and workarounds.
       - Unmet needs and expectations.

    3. Customer Behaviour:
       - Purchasing and decision-making considerations.
       - Adoption barriers.
       - Factors influencing product acceptance.

    4. Customer Value:
       - Outcomes customers expect.
       - Important product capabilities.
       - Available evidence of willingness to pay.

    Use customer reviews, public discussions, industry surveys,
    and credible research reports wherever possible.

    Do not invent interview findings, survey results, or customer
    quotations. Clearly distinguish evidence from assumptions.

  expected_output: >
    A structured customer insights report containing customer
    segments, user needs, pain points, current alternatives,
    expectations, adoption barriers, purchasing considerations,
    and source references.

  async_execution: true
  markdown: true
  agent: customer_insights_researcher


business_requirements_task:
  description: >
    Prepare a structured business requirements specification
    using the original business brief and the three research
    reports provided in the task context.

    Business Idea: {business_idea}
    Business Problem: {business_problem}
    Business Objectives: {business_objectives}
    Target Users: {target_users}
    Industry: {industry}
    Industry Details: {industry_details}
    Target Geography: {target_geography}
    Proposed Features: {proposed_features}
    Existing Systems and Constraints: {existing_systems_constraints}

    Prepare the following:

    1. Business Context:
       - Business problem and objectives.
       - Project background.
       - Intended users and stakeholders.

    2. Project Scope:
       - In-scope features and capabilities.
       - Out-of-scope items.
       - Assumptions, constraints, and dependencies.

    3. Functional Requirements:
       - Convert the stated business needs into clear requirements.
       - Assign unique IDs such as BRD-F-101.
       - Explain the purpose of each requirement.

    4. Non-Functional Requirements:
       - Identify relevant performance, usability, security,
         reliability, and scalability requirements.
       - Assign IDs such as BRD-NF-101.

    5. Requirement Prioritisation:
       - Use Must Have, Should Have, and Could Have priorities.
       - Provide a clear rationale for each priority.

    6. Acceptance Criteria:
       - Define clear and testable acceptance criteria.
       - Link requirements to their relevant business objectives.

    7. Open Questions:
       - Identify missing stakeholder information.
       - Record unresolved assumptions and dependencies.

    The user's original business problem and objectives must remain
    the source of truth. Research findings can support requirements,
    but must not be treated as stakeholder-approved decisions.

    Do not invent budgets, deadlines, stakeholder responses,
    or project approvals.

  expected_output: >
    A structured requirements specification containing business
    objectives, scope, functional requirements, non-functional
    requirements, requirement IDs, priorities, acceptance criteria,
    traceability, dependencies, assumptions, and open questions.

  markdown: true
  agent: business_requirements_analyst


business_analyst_task:
  description: >
    Prepare the final Business Requirements Document for the
    following project:

    Business Idea: {business_idea}
    Business Problem: {business_problem}
    Business Objectives: {business_objectives}

    Use the original business brief, all three research reports,
    and the business requirements specification provided in
    the task context.

    Follow this document structure:

    1. Document Control

    2. Executive Summary and Project Objectives

    3. Context and Business Problem

    4. Project Scope and Boundary Conditions

    5. Detailed Functional Requirements

    6. End-to-End Process and Metric Traceability Matrix

    7. Non-Functional, Technical, and Security Requirements

    8. Implementation Phasing and Acceptance Criteria

    9. Sign-Off and Approval Matrix

    Ensure the following:

    - Preserve requirement IDs and priorities.
    - Maintain consistency across all document sections.
    - Link business objectives to relevant requirements and metrics.
    - Include measurable acceptance criteria.
    - Retain important research findings and source references.
    - Clearly distinguish facts, estimates, and assumptions.
    - Mark missing information as TBD.
    - Include unresolved stakeholder questions.

    Never fabricate stakeholder names, approvals, dates, budgets,
    or business decisions.

    The document must be a professional draft for stakeholder review,
    not a document that implies approval has already been granted.

  expected_output: >
    A complete Business Requirements Document in structured Markdown,
    containing all nine sections, requirement tables, priorities,
    acceptance criteria, traceability, implementation phases,
    assumptions, open questions, source references, and approval matrix.

  markdown: true
  agent: business_analyst