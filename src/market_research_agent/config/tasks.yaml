market_research_task:
  description: >
    Conduct focused market research for the following business idea:

    Project Brief: {project_brief}

    Additional Context: {additional_context}

    Analyse the relevant market in the following areas:

    1. Market Size and Growth:
       - Identify the market directly relevant to the business idea.
       - Report TAM, SAM and SOM only when reliable data and a
         defensible calculation method are available.
       - Include market size, growth rates and forecasts where
         supported by credible sources.
       - Do not use the size of a broad parent industry as the
         addressable market for the proposed product.

    2. Industry Trends:
       - Identify important market and technology developments.
       - Highlight relevant opportunities, risks and adoption trends.

    3. Regulatory Landscape:
       - Identify potentially relevant privacy, security and
         industry regulations.
       - Consider the specified target geography.
       - If no target geography is provided, identify areas
         requiring legal review without claiming that a particular
         regulation definitely applies.

    4. Market Opportunities:
       - Identify underserved segments and unmet market needs.
       - Distinguish evidence-backed opportunities from hypotheses.

    Evidence and reporting rules:

    - Use only information actually obtained from the available
      research sources.
    - Include the exact source URL for every important market
      figure or factual research claim.
    - Include publication dates wherever available.
    - Clearly label verified findings, estimates and hypotheses.
    - Explain the methodology behind any calculated estimate.
    - If reliable information is unavailable, explicitly state
      that the information could not be verified.
    - Never invent market sizes, growth rates, forecasts or
      regulatory requirements.
    - Do not present an analyst estimate as an established fact.

    Research limits:

    - Perform at most two focused Exa searches.
    - Fetch at most one relevant webpage when necessary.
    - Prefer primary and credible sources.
    - Include no more than two source references.
    - Do not repeat searches to find confirmation for an already
      supported finding.

  expected_output: >
    A market research report of approximately 250-350 words.

    Include:
    - Relevant market overview and available sizing.
    - Important industry trends.
    - Relevant regulatory considerations.
    - Market opportunities and risks.
    - Verified findings, estimates and hypotheses clearly labelled.
    - Up to two source references with exact URLs and dates
      wherever available.

    Do not include unsupported market figures or generic industry
    descriptions unrelated to the proposed business.

  markdown: true
  async_execution: true
  agent: market_research_specialist


competitive_intelligence_task:
  description: >
    Conduct focused competitive intelligence research for the
    following business idea:

    Project Brief: {project_brief}

    Additional Context: {additional_context}

    Analyse the competitive landscape in the following areas:

    1. Competitor Identification:
       - Identify relevant direct competitors.
       - Identify important indirect competitors and alternatives.
       - Focus on products serving similar customers or solving
         similar problems.

    2. Competitor Comparison:
       - Company and product overview.
       - Core features and capabilities.
       - Target customer segments.
       - Publicly available pricing and pricing model.
       - Product positioning and differentiation.
       - Verified strengths and limitations.

    3. Competitive Gaps:
       - Identify customer needs that appear underserved.
       - Identify potential areas of differentiation.
       - Highlight competitive threats and barriers to entry.

    Evidence and reporting rules:

    - Prefer official competitor websites, product documentation
      and published pricing pages.
    - Use customer reviews or discussions only as supporting
      evidence of customer experience.
    - Include exact source URLs for important competitor claims.
    - Include publication dates wherever available.
    - Distinguish verified product features from assumptions.
    - Mention pricing only when publicly verified. Include the
      currency and billing period.
    - If pricing is unavailable, write "Not publicly verified".
    - Do not claim that no competitor offers a feature unless
      there is sufficient evidence to support that conclusion.
    - Describe competitive gaps as potential opportunities
      when the available research is limited.
    - Never invent competitor features, prices, funding details,
      customer numbers or market share.

    Research limits:

    - Perform at most two focused Exa searches.
    - Fetch at most one relevant webpage when necessary.
    - Prefer primary and credible sources.
    - Include no more than two source references.
    - Do not repeat searches to find confirmation for an already
      supported finding.

  expected_output: >
    A competitor analysis of approximately 250-350 words.

    Include:
    - Relevant direct and indirect competitors.
    - Their verified offerings and target users.
    - Publicly verified pricing where available.
    - Competitive positioning and potential gaps.
    - Important competitive risks.
    - Up to two source references with exact URLs and dates
      wherever available.

    Do not make unsupported claims about competitor weaknesses
    or market-wide feature gaps.

  markdown: true
  async_execution: true
  agent: competitive_intelligence_analyst


customer_insights_task:
  description: >
    Research potential customers for the following business idea:

    Project Brief: {project_brief}

    Additional Context: {additional_context}

    Analyse the following areas:

    1. Customer Segmentation:
       - Identify relevant customer segments.
       - Distinguish primary and secondary potential users.
       - Explain the characteristics relevant to the business idea.

    2. Customer Needs and Pain Points:
       - Identify problems customers currently face.
       - Identify existing alternatives and workarounds.
       - Highlight unmet needs supported by available evidence.

    3. Customer Behaviour:
       - Identify purchasing and decision-making considerations.
       - Analyse adoption barriers and factors influencing acceptance.
       - Identify evidence of willingness to pay where available.

    4. Customer Value:
       - Identify outcomes customers expect.
       - Highlight product capabilities that may address those needs.

    Evidence and reporting rules:

    - Prefer credible surveys, published research, public reviews
      and relevant customer discussions.
    - Include exact source URLs for important findings.
    - Include survey sample size and geography wherever available.
    - Never invent customer interviews, survey results,
      quotations or purchasing behaviour.
    - Do not present an inferred persona as a verified customer.
    - Clearly distinguish observed customer evidence from
      analyst interpretation and hypotheses.
    - Do not claim willingness to pay without supporting evidence.
    - If evidence is unavailable, explicitly state that it
      could not be verified.

    Research limits:

    - Perform at most two focused Exa searches.
    - Fetch at most one relevant webpage when necessary.
    - Prefer primary and credible sources.
    - Include no more than two source references.
    - Do not repeat searches to find confirmation for an already
      supported finding.

  expected_output: >
    A customer research report of approximately 250-350 words.

    Include:
    - Relevant customer segments.
    - Evidence-backed customer needs and pain points.
    - Existing alternatives and adoption barriers.
    - Available evidence of purchasing behaviour and willingness
      to pay.
    - Clearly labelled hypotheses where evidence is unavailable.
    - Up to two source references with exact URLs and dates
      wherever available.

    Do not fabricate customer feedback, personas or survey findings.

  markdown: true
  async_execution: true
  agent: customer_insights_researcher


business_requirements_task:
  description: >
    Prepare a structured business requirements specification
    using the original business brief and all three research
    reports provided in the task context.

    Project Brief: {project_brief}

    Additional Context: {additional_context}

    The original project brief is the primary source of truth.
    Research findings provide supporting evidence and context,
    but they are not stakeholder-approved requirements.

    First identify the business information explicitly provided
    by the user:

    1. Business Context:
       - Business problem and background.
       - Stated business objectives.
       - Intended users and stakeholders, where provided.

    2. Project Scope:
       - Capabilities explicitly described in the brief.
       - Proposed capabilities suggested by research.
       - Information that remains undefined.
       - Assumptions, constraints and dependencies.

    3. Functional Requirements:
       - Translate explicitly stated product needs into requirements.
       - Assign unique IDs such as BRD-F-101.
       - Explain the purpose of each requirement.
       - Identify the source of every requirement.
       - Mark requirements derived from analyst recommendations
         as Proposed - Approval Required.

    4. Non-Functional Requirements:
       - Identify relevant performance, usability, security,
         reliability, privacy and scalability considerations.
       - Assign IDs such as BRD-NF-101.
       - Do not invent numerical targets or technical thresholds.
       - Mark targets that need engineering or stakeholder
         validation as TBD.

    5. Requirement Prioritisation:
       - Use Must Have, Should Have and Could Have.
       - Provide a brief priority rationale.
       - Mark analyst-assigned priorities as Proposed.

    6. Acceptance Criteria:
       - Define clear and testable acceptance criteria.
       - Link each criterion to its requirement and business objective.
       - Use numerical thresholds only when supported by the brief
         or reliable evidence.
       - Mark unavailable thresholds as TBD instead of guessing.

    7. Open Questions:
       - Identify missing stakeholder decisions.
       - Identify undefined success metrics and measurement methods.
       - Record unresolved assumptions, constraints and dependencies.

    Requirement classification rules:

    - Confirmed by Brief:
      Information or capabilities explicitly stated by the user.

    - Proposed - Approval Required:
      Recommendations or capabilities inferred by the analysts.
      These must never be presented as confirmed stakeholder decisions.

    - Research-Supported:
      Findings supported by the research reports and their source URLs.
      Research evidence does not independently approve product scope.

    - TBD:
      Information that has not been provided or verified.

    Do not invent budgets, deadlines, stakeholder responses,
    approvals, technical architecture or business decisions.

    Include no more than two important findings from each research
    report, retaining their supporting source URLs.

    Avoid repeating entire research reports. Focus on translating
    the brief into a clear, traceable requirements specification.

  expected_output: >
    A structured business requirements specification of
    approximately 750-950 words.

    Include:

    - Business context and objectives.
    - Project scope and boundaries.
    - Functional and non-functional requirements.
    - Unique requirement IDs.
    - Requirement source and confirmation status.
    - Proposed priorities with rationale.
    - Testable acceptance criteria.
    - Requirement-to-objective traceability.
    - Key research findings with source URLs.
    - Assumptions, constraints, dependencies and open questions.

    Clearly distinguish confirmed requirements from proposed
    recommendations.

    Do not invent numerical targets, technical thresholds,
    stakeholder decisions or project approvals.

    Mark missing information as TBD.

  markdown: true
  agent: business_requirements_analyst


business_analyst_task:
  description: >
    Prepare the final Business Requirements Document for the
    following project:

    Project Brief: {project_brief}

    Additional Context: {additional_context}

    Use the original Project Brief as the primary source of truth.
    Use the business requirements specification and its research
    references as supporting inputs.

    The requirements specification already contains the important
    findings from the three research reports. Do not reproduce
    the complete research reports.

    Follow this exact document structure:

    1. Document Control

    2. Executive Summary & Project Objectives
       2.1 Context & Business Problem
       2.2 Strategic Objectives

    3. Project Scope & Boundary Conditions
       3.1 In-Scope Modules
       3.2 Out-of-Scope

    4. Detailed Functional Requirements

    5. End-to-End Pipeline & Metric Traceability Matrix

    6. Non-Functional, Technical & Security Requirements

    7. Implementation Phasing & Acceptance Criteria
       7.1 Implementation Phasing
       7.2 Acceptance Criteria
       7.3 Assumptions, Constraints & Dependencies

    8. Sign-Off & Approval Matrix
       8.1 Open Questions Blocking Sign-Off

    DOCUMENT CONTROL:

    - Use a professional draft status for stakeholder review.
    - Use TBD for missing document IDs, author names, dates,
      version approval and other unavailable information.
    - Never imply that approval has already been granted.

    BUSINESS OBJECTIVES:

    - Preserve the objectives and numerical targets stated in
      the original brief.
    - Do not invent target dates or measurement definitions.
    - Clearly identify objectives whose measurement method,
      baseline or timeframe remains undefined.

    PROJECT SCOPE:

    - Separate capabilities explicitly stated in the brief from
      proposed capabilities requiring approval.
    - Do not invent an out-of-scope list.
    - If the brief does not define exclusions, state that
      out-of-scope items are yet to be confirmed.

    FUNCTIONAL REQUIREMENTS:

    - Preserve the requirement IDs from the specification.
    - Include source/status labels for each requirement.
    - Distinguish Confirmed by Brief from Proposed - Approval Required.
    - Preserve priorities and identify proposed priorities as such.
    - Do not add new requirements during document generation.

    PIPELINE AND TRACEABILITY:

    - Describe the applicable end-to-end business process.
    - Include technical pipeline stages only when supported by
      the proposed solution or explicitly identified as proposed.
    - Link process stages to their relevant requirement IDs
      and business objectives.
    - Link metrics to their measurement methods and sources.
    - Use TBD for undefined metrics and thresholds.

    NON-FUNCTIONAL REQUIREMENTS:

    - Include only relevant and justified requirements.
    - Do not invent latency, availability, scalability, security
      or accuracy thresholds.
    - Mark unvalidated numerical targets as Proposed - TBD.
    - Do not claim that a particular privacy regulation applies
      without a confirmed target geography and supporting evidence.

    IMPLEMENTATION AND ACCEPTANCE:

    - Group requirements into sensible implementation phases.
    - Base phasing on requirement priorities.
    - Clearly mark proposed phasing as requiring stakeholder review.
    - Include testable acceptance criteria.
    - Do not invent numerical success thresholds.

    RESEARCH AND REFERENCES:

    - Retain important verified research findings.
    - Preserve exact source URLs from the research reports.
    - Include publication dates and source names where available.
    - Do not cite sources that were not actually retrieved.
    - If a research claim has no verifiable source URL,
      omit the claim or clearly mark it as unverified.

    APPROVAL:

    - Never fabricate stakeholder names, roles, signatures,
      approval dates or business decisions.
    - Use TBD for missing approval information.
    - Include open questions that block final approval.

    Treat the supplied BRD document only as a structure and
    formatting reference. Never reuse its project details,
    names, company information, figures or approval data.

    Write the document using Markdown heading markers (#, ##, ###).
    Use concise tables where they make requirements easier to review.

  expected_output: >
    A complete Business Requirements Document of approximately
    1,300-1,700 words.

    Follow all eight sections and their specified subsections.

    Preserve requirement IDs, source/status labels, priorities,
    acceptance criteria, objective traceability, research references,
    assumptions, dependencies and open questions.

    Separate confirmed information from proposed recommendations.

    Do not repeat the same information across multiple sections.
    Do not invent requirements, figures, technical targets,
    stakeholder decisions or approvals.

    Use TBD wherever information is missing or unverified.

    The result must be a professional draft for stakeholder review,
    not an approved or finalised business specification.

  markdown: true
  agent: business_analyst