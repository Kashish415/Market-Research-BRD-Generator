[project]
name = "market_research_agent"
version = "0.1.0"
description = "market_research_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools[mcp]>=1.15.33",
    "crewai[litellm,tools]>=1.15.30,<2.0.0",
    "httpx>=0.28.1,<1.0",
    "nicegui==3.19.0",
    "openai>=2.54.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
run_crew = "market_research_agent.main:run"
market_research_ui = "market_research_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "9b9ee894-a944-448f-bcf9-819162a9c1e7"
